[project]
name = "ultimate-trading-bot"
version = "1.0.0"
description = "AI-assisted crypto trading bot: regime-aware ensemble strategies, honest backtesting, paper-first execution"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that hit live network services (exchanges, Ollama)",
]
filterwarnings = [
    "ignore::DeprecationWarning:ccxt.*",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
